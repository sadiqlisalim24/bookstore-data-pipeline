services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bookstore
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bookstore"]
      interval: 2s
      timeout: 3s
      retries: 20

  pipeline:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/bookstore
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
